<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="Calendario()">

    <div id="mensagem">
        <h1>Conta Criada</h1>
    </div>

    <div id="mensagemError">
        <h1>Erro na crição</h1>
    </div>

    <div class="Container">
        <div id="area" class="login_area">
            <h1 id="title">Cadastrar usuario</h1>

            <div class="formulario">
                <form onsubmit="submit()">
                    <div>
                        <label id="label1">Seu Nome</label>
                    </div>
                    <input type="text" text="Nome do usuario" id="nome" name="name" placeholder="Nome" />

                    <div>
                        <label id="label2">Sua Senha</label>
                    </div>
                    <input type="password" text="Senah do usuario" id="senha" name="passowrd" placeholder="Senha" />

                    <div id="recuperar_senha">
                        <span>Esqueceu a senha?</span>
                    </div>

                    <div id="recuperar_senha2">
                        <span>Esqueceu a senha?</span>
                    </div>

                    <div id="btn1">
                        <button id="butao" type="button" onclick="enviar()">Enviar</button>
                    </div>

                    <div id="btn2">
                        <button id="butao" type="button" onclick="enviar()">Enviar</button>
                    </div>
                </form>

                <div id="divisa1" class="divisor">
                    <p><span></span> ou continue com <span></span></p>
                </div>
                <div id="divisa2" class="divisor2">
                    <p><span></span> ou continue com <span></span></p>
                </div>


                <div id="contato1">
                    <a href="">Google <i class="fa-brands fa-google"></i></a>

                    <a href="">Facebook <i class="fa-brands fa-facebook"></i></a>
                </div>

                <div id="contato2">
                    <a href="">Google <i class=" fa-brands fa-google"></i></a>
                    <a href="">Facebook <i class="fa-brands fa-facebook"></i></a>
                </div>


                <button onclick="mudar_dark()" id="claro" class="tema1">
                    <i class="fa-solid fa-sun"></i>
                </button>

                <button id="dark" onclick="mudar_claro()" class="tema2">
                    <i class=" fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </div>
    <div id="infors">
        <p id="horas"></p>
        <p id="datas"></p>
        <p id="semana"></p>
    </div>
    <!--MENU -->
    <div onclick="menu()" id="configurar">
        <a><i class="fa-solid fa-bars"></i></a>
    </div>

    <div id="itens">
        <a onclick="fechaMenu()" id="fechaMenu">Fechar</a>
        <ul>
            <li>Contato</li>
            <li>Contato</li>
            <li>Contato</li>
            <li>Contato</li>

        </ul>

        <div id="redesSociais">
            <a>instagram</a>
            <a>Facebook</a>
        </div>
    </div>

</body>

<script src="login.js"></script>

</html>
